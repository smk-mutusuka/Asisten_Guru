<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant Guru - SMK Mutusuka</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="global-loader" class="hidden">
  <div class="spinner"></div>
  <p>Memproses data...</p>
</div>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-box">
    <img src="logo.png" alt="Logo SMK" class="login-logo">
    <h2>AI Assistant Guru</h2>
    <p>SMK Muhammadiyah 1 Surakarta</p>

    <div class="login-tabs">
      <button type="button" class="login-tab-btn active" id="tab-btn-admin" onclick="switchLoginTab('admin')"><i class="fas fa-user-shield"></i> Admin</button>
      <button type="button" class="login-tab-btn" id="tab-btn-gtk" onclick="switchLoginTab('gtk')"><i class="fas fa-chalkboard-teacher"></i> GTK</button>
    </div>
    
    <form id="loginFormAdmin" onsubmit="handleLoginAdmin(event)" autocomplete="off">
      <div class="form-group" style="text-align: left;">
        <label for="username">Username Admin</label>
        <input type="text" id="username" class="form-control" required placeholder="admin">
      </div>
      <div class="form-group" style="text-align: left;">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" class="form-control" required placeholder="admin123">
          <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px; min-height:46px;"><i class="fas fa-sign-in-alt"></i> Masuk Admin</button>
    </form>

    <form id="loginFormGtk" onsubmit="handleLoginGTK(event)" autocomplete="off" class="hidden">
      <div class="form-group" style="text-align: left;">
        <label for="nbm_login"><i class="fas fa-id-badge"></i> NBM</label>
        <input type="text" id="nbm_login" class="form-control" required placeholder="1172972">
      </div>
      <div class="form-group" style="text-align: left;">
        <label for="password_gtk"><i class="fas fa-lock"></i> Password</label>
        <div class="password-wrapper">
          <input type="password" id="password_gtk" class="form-control" required placeholder="NBM Anda">
          <i class="fas fa-eye toggle-password" onclick="togglePassword('password_gtk', this)"></i>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px; min-height:46px;"><i class="fas fa-sign-in-alt"></i> Masuk GTK</button>
    </form>
  </div>
  <div class="login-footer">Developed by <strong>Joko Harinto</strong><br><span style="font-size: 10px;">Ver. 1.0.1126</span></div>
</div>

<!-- APP LAYOUT -->
<div id="app-layout" class="hidden">
  <div class="topbar">
    <div class="brand"><i class="fas fa-robot"></i> AI Guru Mutusuka</div>
    <div class="user-info">
      <span id="user-name">Nama Guru</span>
      <button class="btn btn-outline btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Keluar</button>
    </div>
  </div>

  <div class="main-content">
    <div class="ai-tabs">
      <button type="button" class="ai-tab-btn active" data-tab="prota" onclick="switchTab('prota')"><i class="fas fa-calendar-alt"></i> Prota & Promes</button>
      <button type="button" class="ai-tab-btn" data-tab="modul_ajar" onclick="switchTab('modul_ajar')"><i class="fas fa-book-open"></i> Modul Ajar</button>
      <button type="button" class="ai-tab-btn" data-tab="soal" onclick="switchTab('soal')"><i class="fas fa-question-circle"></i> Buat Soal</button>
      <button type="button" class="ai-tab-btn" data-tab="kokurikuler" onclick="switchTab('kokurikuler')"><i class="fas fa-users-cog"></i> Kokurikuler</button>
    </div>

    <!-- PANEL PROTA -->
    <div id="panel-prota" class="ai-panel">
      <div class="card">
        <div class="ai-form-section-title"><i class="fas fa-id-card"></i> A. Identitas</div>
        <div class="ai-form-grid">
          <div class="form-group"><label>Nama Guru</label><input type="text" id="pt_namaGuru" class="form-control" readonly></div>
          <div class="form-group"><label>NIP/NBM</label><input type="text" id="pt_nipGuru" class="form-control" readonly></div>
          <div class="form-group"><label>Mata Pelajaran</label><input type="text" id="pt_mapel" class="form-control" placeholder="Contoh: SMAW" required></div>
          <div class="form-group"><label>Kelas</label><select id="pt_kelas" class="form-control"><option value="10">10</option><option value="11" selected>11</option><option value="12">12</option></select></div>
        </div>
        <div class="ai-form-section-title"><i class="fas fa-clock"></i> B. Modal Waktu</div>
        <div class="ai-form-grid">
          <div class="form-group"><label>Minggu Efektif</label><input type="number" id="pt_minggu" class="form-control" value="18"></div>
          <div class="form-group"><label>JP per Minggu</label><input type="number" id="pt_jp" class="form-control" value="4"></div>
        </div>
        <button class="btn btn-primary btn-generate" onclick="generateAI('prota')"><i class="fas fa-magic"></i> Generate Prota & Promes</button>
      </div>
      <div id="output-prota" class="output-container"></div>
    </div>

    <!-- PANEL MODUL AJAR -->
    <div id="panel-modul_ajar" class="ai-panel hidden">
      <div class="card">
        <div class="ai-form-section-title"><i class="fas fa-info-circle"></i> Informasi Dasar</div>
        <div class="ai-form-grid">
          <div class="form-group"><label>Nama Guru</label><input type="text" id="ma_namaGuru" class="form-control" readonly></div>
          <div class="form-group"><label>Mata Pelajaran</label><input type="text" id="ma_mapel" class="form-control" placeholder="Contoh: Gambar Teknik Manufaktur"></div>
          <div class="form-group"><label>Materi Pokok</label><input type="text" id="ma_materi" class="form-control" placeholder="Contoh: Menggunakan Software AutoCAD"></div>
          <div class="form-group"><label>Jumlah Pertemuan</label><input type="number" id="ma_pertemuan" class="form-control" value="3"></div>
        </div>
        <div class="ai-form-section-title"><i class="fas fa-tools"></i> Sarana & Dimensi Lulusan</div>
        <div class="form-group"><label>Sarana & Prasarana</label><input type="text" id="ma_sarana" class="form-control" placeholder="Contoh: Lab Komputer, Software AutoCAD..."></div>
        <div class="form-group"><label>Dimensi Profil Lulusan (Pilih 2-3)</label>
          <div class="ai-checkbox-grid">
            <label class="ai-checkbox-item"><input type="checkbox" name="ma_dimensi" value="D1"><span><strong>D1</strong> — Keimanan</span></label>
            <label class="ai-checkbox-item"><input type="checkbox" name="ma_dimensi" value="D2"><span><strong>D2</strong> — Kewargaan</span></label>
            <label class="ai-checkbox-item"><input type="checkbox" name="ma_dimensi" value="D3"><span><strong>D3</strong> — Penalaran Kritis</span></label>
            <label class="ai-checkbox-item"><input type="checkbox" name="ma_dimensi" value="D4"><span><strong>D4</strong> — Kreativitas</span></label>
            <label class="ai-checkbox-item"><input type="checkbox" name="ma_dimensi" value="D5"><span><strong>D5</strong> — Kolaborasi</span></label>
            <label class="ai-checkbox-item"><input type="checkbox" name="ma_dimensi" value="D6"><span><strong>D6</strong> — Kemandirian</span></label>
            <label class="ai-checkbox-item"><input type="checkbox" name="ma_dimensi" value="D7"><span><strong>D7</strong> — Kesehatan</span></label>
            <label class="ai-checkbox-item"><input type="checkbox" name="ma_dimensi" value="D8"><span><strong>D8</strong> — Komunikasi</span></label>
          </div>
        </div>
        <button class="btn btn-primary btn-generate" onclick="generateAI('modul_ajar')"><i class="fas fa-magic"></i> Generate Modul Ajar</button>
      </div>
      <div id="output-modul_ajar" class="output-container"></div>
    </div>

    <!-- PANEL SOAL -->
    <div id="panel-soal" class="ai-panel hidden">
      <div class="card">
        <div class="ai-form-section-title"><i class="fas fa-list-ol"></i> A. Identitas & Komposisi Soal</div>
        <div class="ai-form-grid">
          <div class="form-group"><label>Nama Guru</label><input type="text" id="so_namaGuru" class="form-control" readonly></div>
          <div class="form-group"><label>Mata Pelajaran</label><input type="text" id="so_mapel" class="form-control" placeholder="Contoh: Teknik Pemesinan"></div>
          <div class="form-group"><label>Materi/Topik</label><input type="text" id="so_materi" class="form-control" placeholder="Contoh: Alat potong mesin bubut"></div>
          <div class="form-group"><label>Jumlah PG</label><input type="number" id="so_pg" class="form-control" value="20"></div>
          <div class="form-group"><label>Jumlah Esai</label><input type="number" id="so_esai" class="form-control" value="5"></div>
        </div>
        <div class="ai-form-section-title"><i class="fas fa-brain"></i> B. Level Kognitif</div>
        <div class="ai-checkbox-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
          <label class="ai-checkbox-item"><input type="checkbox" name="so_kognitif" value="C3" checked><span>C3</span></label>
          <label class="ai-checkbox-item"><input type="checkbox" name="so_kognitif" value="C4" checked><span>C4</span></label>
          <label class="ai-checkbox-item"><input type="checkbox" name="so_kognitif" value="C5"><span>C5</span></label>
          <label class="ai-checkbox-item"><input type="checkbox" name="so_kognitif" value="C6"><span>C6</span></label>
        </div>
        <button class="btn btn-primary btn-generate" onclick="generateAI('soal')"><i class="fas fa-magic"></i> Buat Soal Ujian</button>
      </div>
      <div id="output-soal" class="output-container"></div>
    </div>

    <!-- PANEL KOKURIKULER -->
    <div id="panel-kokurikuler" class="ai-panel hidden">
      <div class="card">
        <div class="ai-form-section-title"><i class="fas fa-palette"></i> A. Tema & Topik</div>
        <div class="ai-form-grid">
          <div class="form-group"><label>Nama Penyusun</label><input type="text" id="kk_namaGuru" class="form-control" readonly></div>
          <div class="form-group"><label>Tema Utama</label><input type="text" id="kk_tema" class="form-control" value="Lingkungan Hidup dan Keberlanjutan"></div>
          <div class="form-group"><label>Topik Projek</label><input type="text" id="kk_topik" class="form-control" placeholder="Contoh: Pengolahan Limbah Logam"></div>
        </div>
        <div class="ai-form-section-title"><i class="fas fa-bullseye"></i> B. Dimensi Lulusan</div>
        <div class="ai-checkbox-grid">
          <label class="ai-checkbox-item"><input type="checkbox" name="kk_dimensi" value="D1"><span><strong>D1</strong> — Keimanan</span></label>
          <label class="ai-checkbox-item"><input type="checkbox" name="kk_dimensi" value="D2"><span><strong>D2</strong> — Kewargaan</span></label>
          <label class="ai-checkbox-item"><input type="checkbox" name="kk_dimensi" value="D3"><span><strong>D3</strong> — Penalaran Kritis</span></label>
          <label class="ai-checkbox-item"><input type="checkbox" name="kk_dimensi" value="D4"><span><strong>D4</strong> — Kreativitas</span></label>
          <label class="ai-checkbox-item"><input type="checkbox" name="kk_dimensi" value="D5"><span><strong>D5</strong> — Kolaborasi</span></label>
          <label class="ai-checkbox-item"><input type="checkbox" name="kk_dimensi" value="D6"><span><strong>D6</strong> — Kemandirian</span></label>
        </div>
        <button class="btn btn-primary btn-generate" onclick="generateAI('kokurikuler')"><i class="fas fa-magic"></i> Generate Modul Kokurikuler</button>
      </div>
      <div id="output-kokurikuler" class="output-container"></div>
    </div>
  </div>
</div>

<script src="js-ai-guru.js"></script>
</body>
</html>
